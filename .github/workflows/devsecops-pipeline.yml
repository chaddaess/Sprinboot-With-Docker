name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "tp2_devsecops" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B clean compile --file pom.xml
      
    - name: Run Unit Tests
      run: mvn -B test --file pom.xml
      
    - name: Generate Test Report
      if: always()
      run: mvn surefire-report:report
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 7
        
    - name: Package Application
      run: mvn -B package -DskipTests --file pom.xml
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: target/*.jar
        retention-days: 7

  sast-sonarqube:
    name: SAST - SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Wait for SonarQube to be ready
      run: |
        echo "⏳ Waiting for SonarQube to start..."
        timeout 300 bash -c 'until curl -s http://localhost:9000/api/system/status | grep -q "UP"; do sleep 5; done'
        echo "✅ SonarQube is ready!"
        
    - name: Create SonarQube project
      run: |
        # Generate token
        TOKEN=$(curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions" | jq -r '.token')
        echo "SONAR_TOKEN=$TOKEN" >> $GITHUB_ENV
        
        # Create project
        curl -u admin:admin -X POST "http://localhost:9000/api/projects/create?name=Sprinboot-With-Docker&project=sprinboot-docker&visibility=public"
        
    - name: Build and analyze with SonarQube
      run: |
        mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=sprinboot-docker \
          -Dsonar.projectName=Sprinboot-With-Docker \
          -Dsonar.host.url=http://localhost:9000 \
          -Dsonar.token=${{ env.SONAR_TOKEN }}
          
    - name: Check SonarQube Quality Gate
      run: |
        echo "⏳ Checking Quality Gate status..."
        sleep 10
        
        # Get quality gate status
        STATUS=$(curl -s -u admin:admin "http://localhost:9000/api/qualitygates/project_status?projectKey=sprinboot-docker" | jq -r '.projectStatus.status')
        
        echo "Quality Gate Status: $STATUS"
        
        if [ "$STATUS" != "OK" ] && [ "$STATUS" != "NONE" ]; then
          echo "❌ Quality Gate Failed! Security vulnerabilities or quality issues detected."
          echo "📊 Check the logs above for detailed SonarQube analysis results."
          exit 1
        else
          echo "✅ Quality Gate Passed!"
        fi
        
    - name: Display SonarQube Results
      if: always()
      run: |
        echo "📊 SonarQube Analysis Results:"
        echo "Dashboard: http://localhost:9000/dashboard?id=sprinboot-docker"
        echo "Note: This is a temporary instance running during CI/CD"
        
        # Get metrics
        curl -s -u admin:admin "http://localhost:9000/api/measures/component?component=sprinboot-docker&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,coverage" | jq '.'
