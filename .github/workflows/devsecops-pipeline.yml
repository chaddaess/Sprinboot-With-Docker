name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "tp2_devsecops" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B clean compile --file pom.xml
      
    - name: Run Unit Tests
      run: mvn -B test --file pom.xml
      
    - name: Generate Test Report
      if: always()
      run: mvn surefire-report:report
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 7
        
    - name: Package Application
      run: mvn -B package -DskipTests --file pom.xml
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: target/*.jar
        retention-days: 7

  sast-analysis:
    name: SAST - Static Code Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Run SpotBugs Security Analysis
      run: |
        echo "🔍 Running SpotBugs for security vulnerability detection..."
        mvn -B compile spotbugs:spotbugs -Dspotbugs.effort=Max -Dspotbugs.threshold=Low
      continue-on-error: true
        
    - name: Generate SpotBugs Report
      run: |
        mvn spotbugs:gui || true
        if [ -f target/spotbugsXml.xml ]; then
          echo "📊 SpotBugs found potential issues:"
          cat target/spotbugsXml.xml
        fi
        
    - name: Run PMD Security Analysis
      run: |
        echo "🔍 Running PMD for code quality and security..."
        mvn -B pmd:pmd pmd:cpd
      continue-on-error: true
        
    - name: Check for Security Issues
      run: |
        echo "🔎 Analyzing code for security vulnerabilities..."
        
        # Check for hardcoded credentials
        echo "Checking for hardcoded credentials..."
        if grep -r "password.*=" src/ --include="*.java" | grep -v "//"; then
          echo "❌ CRITICAL: Hardcoded credentials detected!"
          echo "Found hardcoded passwords in source code"
          exit 1
        fi
        
        # Check for SQL injection patterns
        echo "Checking for SQL injection vulnerabilities..."
        if grep -r "SELECT.*+.*" src/ --include="*.java" | grep -v "//"; then
          echo "❌ CRITICAL: Potential SQL injection vulnerability detected!"
          echo "Found SQL queries with string concatenation"
          exit 1
        fi
        
        # Check for command injection
        echo "Checking for command injection vulnerabilities..."
        if grep -r "Runtime.getRuntime().exec" src/ --include="*.java" | grep -v "//"; then
          echo "❌ CRITICAL: Command injection vulnerability detected!"
          echo "Found direct command execution with Runtime.exec()"
          exit 1
        fi
        
        # Check for path traversal
        echo "Checking for path traversal vulnerabilities..."
        if grep -r "new File.*+.*" src/ --include="*.java" | grep -v "//"; then
          echo "⚠️  WARNING: Potential path traversal vulnerability!"
          echo "Found file operations with unsanitized input"
        fi
        
        echo "✅ Basic security checks completed"
        
    - name: Upload SAST Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sast-reports
        path: |
          target/spotbugsXml.xml
          target/pmd.xml
          target/site/
        retention-days: 7

  sca-analysis:
    name: SCA - Dependency Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Display Dependencies
      run: |
        echo "� Analyzing project dependencies..."
        mvn dependency:tree -Dverbose=false
        
    - name: Check for Known Vulnerable Dependencies
      run: |
        echo "🔍 Checking for known vulnerable dependencies..."
        
        # Spring Boot 2.5.5 has known CVEs - check for them
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📋 KNOWN VULNERABILITY CHECK"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        VULNERABLE=0
        
        # Check Spring Boot version
        SB_VERSION=$(grep -oP '<version>\K[^<]+' pom.xml | head -1)
        echo "🔎 Spring Boot Version: $SB_VERSION"
        
        # Spring Boot 2.5.x and 2.6.x have multiple CVEs
        if [[ "$SB_VERSION" =~ ^2\.[0-5]\. ]]; then
          echo "🔴 CRITICAL: Spring Boot $SB_VERSION has known vulnerabilities:"
          echo "   - CVE-2021-22060: HTTP Response Splitting"
          echo "   - CVE-2022-22965: Spring4Shell RCE"
          echo "   - CVE-2022-22950: Spring Framework DoS"
          echo "   - Recommendation: Upgrade to Spring Boot 2.7.x or 3.x"
          VULNERABLE=1
        elif [[ "$SB_VERSION" =~ ^2\.6\. ]]; then
          echo "🔴 CRITICAL: Spring Boot $SB_VERSION has known vulnerabilities:"
          echo "   - CVE-2022-22965: Spring4Shell RCE"
          echo "   - CVE-2022-22950: Spring Framework DoS"
          echo "   - Recommendation: Upgrade to Spring Boot 2.7.18 or 3.x"
          VULNERABLE=1
        elif [[ "$SB_VERSION" =~ ^2\.7\. ]]; then
          # Spring Boot 2.7.18+ is safe
          PATCH_VERSION=$(echo "$SB_VERSION" | cut -d'.' -f3)
          if [ "$PATCH_VERSION" -lt 18 ]; then
            echo "⚠️  WARNING: Spring Boot $SB_VERSION may have vulnerabilities"
            echo "   - Recommendation: Upgrade to Spring Boot 2.7.18 or later"
            # Not marking as VULNERABLE for 2.7.x to allow some flexibility
          else
            echo "✅ Spring Boot $SB_VERSION - No known critical vulnerabilities"
          fi
        elif [[ "$SB_VERSION" =~ ^3\. ]]; then
          echo "✅ Spring Boot $SB_VERSION - Modern version with latest security patches"
        else
          echo "⚠️  WARNING: Unrecognized Spring Boot version: $SB_VERSION"
        fi
        
        # Check for log4j (should not be present, but good to check)
        if mvn dependency:tree | grep -q "log4j-core"; then
          LOG4J_VERSION=$(mvn dependency:tree | grep -oP 'log4j-core:jar:\K[0-9.]+')
          if [[ "$LOG4J_VERSION" < "2.17.1" ]]; then
            echo "🔴 CRITICAL: Log4j $LOG4J_VERSION - vulnerable to Log4Shell (CVE-2021-44228)"
            echo "   - Recommendation: Upgrade to Log4j 2.17.1 or later"
            VULNERABLE=1
          fi
        fi
        
        # Check for Spring Framework version (only for older Spring Boot versions)
        if [[ "$SB_VERSION" =~ ^2\.[0-5]\. ]] || [[ "$SB_VERSION" =~ ^2\.6\. ]]; then
          if mvn dependency:tree | grep -q "spring-web:"; then
            echo "🔎 Checking Spring Framework dependencies..."
            echo "   - Spring Framework has known vulnerabilities in this Spring Boot version"
            echo "   - CVE-2022-22965: Spring4Shell RCE"
          fi
        fi
        
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        
        if [ $VULNERABLE -eq 1 ]; then
          echo ""
          echo "❌ SECURITY GATE FAILED: Known vulnerable dependencies detected!"
          echo ""
          echo "📝 Remediation Steps:"
          echo "1. Update Spring Boot to 2.7.18 or 3.x in pom.xml"
          echo "2. Run 'mvn clean install' to verify"
          echo "3. Re-test the application"
          echo ""
          exit 1
        else
          echo ""
          echo "✅ SECURITY GATE PASSED: No known vulnerable dependencies found"
        fi
        
    - name: Generate Dependency Report
      if: always()
      run: |
        echo "📄 Generating dependency report..."
        mvn project-info-reports:dependencies
        mvn versions:display-dependency-updates || true
        
    - name: Upload Dependency Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-reports
        path: |
          target/site/
          target/*.txt
        retention-days: 7

  dast-scan:
    name: DAST - Dynamic Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-analysis, dependency-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: application-jar
        path: target/
        
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Build Docker Image
      run: |
        echo "🐳 Building Docker image for testing..."
        docker build -t app-under-test:latest .
        
    - name: Start Application Container
      run: |
        echo "🚀 Starting application in ephemeral environment..."
        docker run -d --name test-app -p 8080:8080 app-under-test:latest
        
        # Wait for application to be ready (max 60 seconds)
        echo "⏳ Waiting for application to start..."
        for i in {1..30}; do
          if curl -s http://localhost:8080/api/v1/welcome > /dev/null 2>&1; then
            echo "✅ Application is ready!"
            break
          fi
          echo "Waiting... ($i/30)"
          sleep 2
        done
        
        # Verify application is running
        if ! curl -s http://localhost:8080/api/v1/welcome > /dev/null 2>&1; then
          echo "❌ Application failed to start!"
          docker logs test-app
          exit 1
        fi
        
        # Test vulnerable endpoints are accessible
        echo "🔍 Testing vulnerable endpoints..."
        curl -s "http://localhost:8080/api/v1/secure/search?query=test" || echo "Search endpoint not ready"
        curl -s "http://localhost:8080/api/v1/secure/admin/config" || echo "Admin endpoint not ready"
        
    - name: Create ZAP Config
      run: |
        echo "⚙️  Creating ZAP scan configuration..."
        # Create a simple ZAP config file
        cat > zap-rules.conf << 'EOF'
        # ZAP Scanning Rules Configuration
        # Format: RULE_ID THRESHOLD (IGNORE, INFO, WARN, FAIL)
        
        # Ignore rules that are not critical for this demo
        10021 IGNORE  # X-Content-Type-Options header missing
        10096 IGNORE  # Timestamp Disclosure
        10109 IGNORE  # Modern Web Application
        10049 IGNORE  # Content Cacheability
        EOF
        
    - name: Run OWASP ZAP Baseline Scan
      run: |
        echo "🎯 Running OWASP ZAP Dynamic Application Security Testing..."
        
        # Pull ZAP Docker image
        docker pull ghcr.io/zaproxy/zaproxy:stable
        
        # Run ZAP baseline scan with aggressive settings
        # -a to include alpha scanners
        # -j to use AJAX spider for better coverage
        docker run --network="host" -v $(pwd):/zap/wrk/:rw \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:8080 \
          -r zap-report.html \
          -J zap-report.json \
          -w zap-report.md \
          -c zap-rules.conf \
          -a \
          -j \
          || echo "ZAP scan completed (may have findings)"
          
    - name: Analyze ZAP Results
      if: always()
      run: |
        echo "📊 Analyzing OWASP ZAP scan results..."
        
        if [ -f zap-report.json ]; then
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 DAST SCAN RESULTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Count alerts by risk level
          HIGH_ALERTS=$(cat zap-report.json | grep -o '"risk":"High"' | wc -l || echo "0")
          MEDIUM_ALERTS=$(cat zap-report.json | grep -o '"risk":"Medium"' | wc -l || echo "0")
          LOW_ALERTS=$(cat zap-report.json | grep -o '"risk":"Low"' | wc -l || echo "0")
          INFO_ALERTS=$(cat zap-report.json | grep -o '"risk":"Informational"' | wc -l || echo "0")
          
          echo "🔴 High Risk Alerts: $HIGH_ALERTS"
          echo "🟡 Medium Risk Alerts: $MEDIUM_ALERTS"
          echo "🟢 Low Risk Alerts: $LOW_ALERTS"
          echo "ℹ️  Informational: $INFO_ALERTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Fail on high risk vulnerabilities
          if [ "$HIGH_ALERTS" -gt "0" ]; then
            echo "❌ DAST SCAN FAILED: High risk vulnerabilities detected!"
            echo ""
            echo "📝 Review the ZAP report for details and remediation steps"
            exit 1
          else
            echo "✅ DAST SCAN PASSED: No high-risk vulnerabilities found"
          fi
        else
          echo "⚠️  ZAP report not found, scan may have failed"
          exit 1
        fi
        
    - name: Upload ZAP Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: zap-reports
        path: |
          zap-report.html
          zap-report.json
          zap-report.md
        retention-days: 7
        
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up ephemeral environment..."
        docker stop test-app || true
        docker rm test-app || true
        docker rmi app-under-test:latest || true
        echo "✅ Cleanup complete"
